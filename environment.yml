# One env for everything on spiritx: the LAGRANTO pipeline, colindex2 / analogues,
# and the thesis analysis + plotting. Lives on /homedata so $HOME stays code-only:
#
#   export CONDA_PKGS_DIRS=/homedata/$USER/conda/pkgs
#   conda env create --solver=libmamba -p /homedata/$USER/conda/thesis -f environment.yml
#   conda activate /homedata/$USER/conda/thesis
#   python -m ipykernel install --user --name thesis --display-name "thesis (spiritx)"
#
# Versions: the core is pinned to the exact versions of the Levante analogues-2026
# env (a combination known to install together, numpy 1.26). Packages only in the
# thesis env get minimum versions: their old exact builds need older C libraries
# (netCDF 4.9.2, older PROJ) and cannot coexist with the 2026 core. pip packages
# keep their Levante versions.
# Left out: torch + CUDA (no GPUs on spiritx), basemap (cartopy is used instead),
# the py3.7 phd env (superseded).
name: thesis
channels:
  - conda-forge
dependencies:
  # --- core: exact versions of analogues-2026 (known to coexist)
  - python=3.10
  - numpy=1.26.4
  - scipy=1.15.2
  - pandas=2.3.3
  - xarray=2025.6.1
  - dask=2026.3.0
  - netcdf4=1.7.4
  - h5netcdf=1.8.1
  - cftime=1.6.5
  - bottleneck=1.6.0
  - numba=0.65.1
  - joblib=1.5.3
  - scikit-learn=1.7.2
  - statsmodels=0.14.6
  - matplotlib=3.10.9
  - cartopy=0.25.0
  - shapely=2.1.2
  - cdo=2.5.0                 # any version works for the pipeline; this one ran on Levante
  - python-cdo=1.6.1
  - eccodes=2.46.0
  - ipykernel=7.3.0
  - jupyter_client=8.9.1
  - pip
  - git
  # build tools: sdfc compiles C++ during its pip install
  - eigen=5.0.1
  - pybind11=3.0.3
  - cxx-compiler=1.11.0
  # --- only in the thesis env: minimum versions, builds must fit the core libraries
  - tqdm>=4.67
  - scikit-image>=0.25
  - pygrib>=2.1.6
  - ecmwf-api-client>=1.6.5
  - xesmf>=0.8.8
  - esmpy>=8.7
  - metpy>=1.7
  - seaborn>=0.13.2
  - cmocean>=4.0.3
  - pycoare
  - nco                       # NCO binaries (ncks, ...) for the nco python wrapper
  # --- pip-installed on Levante: same route, same versions
  - pip:
      - colindex2==2.11.0
      - sdfc==0.9.0
      - sklearn-xarray==0.4.0
      - cfgrib==0.9.15.1
      - cdsapi==0.7.7
      - geopandas==1.0.1
      - pyogrio==0.10.0
      - rasterio==1.4.3
      - regionmask==0.13.0
      - gsw==3.6.19
      - cmcrameri==1.9
      - ipyleaflet==0.19.2
      - copernicusmarine==1.3.5
      - earthaccess==0.14.0
      - s3fs==2026.4.0
      - nco==1.1.0
      - cachier==3.1.2
      - nicopal==0.6.4
      - pqdm==0.2.0
